name: bifu
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  
  # PyTorch (CPU版本)
  # 如需 CUDA 版本，请使用: pytorch-cuda=11.8 或 pytorch-cuda=12.1
  - pytorch=2.5.1
  - torchvision=0.20.1
  
  # 基础数据处理
  - numpy>=1.21.0
  - pandas>=1.3.0
  - pillow>=8.0.0
  
  # 机器学习
  - scikit-learn>=1.0.0
  
  # 可视化
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  
  # Jupyter
  - jupyter>=1.0.0
  - ipywidgets>=7.6.0
  
  # Web Demo（project/src/demo.py 依赖）
  - pip:
    - gradio==6.25.0
  
  # 工具
  - tqdm>=4.60.0
  - pyyaml>=5.4.0

# 安装方式:
# 1. 创建环境: conda env create -f environment.yml
# 2. 激活环境: conda activate bifu
# 3. 更新环境: conda env update -f environment.yml